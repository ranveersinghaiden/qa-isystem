server:
  port: 8080
  # ── Security: request size limit (guards against OOM via huge diff payloads) ─
  tomcat:
    max-http-form-post-size: 10MB

spring:
  application:
    name: pr-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false
    properties:
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 10000

kafka:
  topics:
    feature-updates: FeatureUpdatesQueue

# ── GitHub / AI integration — intentionally disabled ──────────────────────────
# pr-service is a pure ingestion service: it receives webhook events and
# publishes them to Kafka. It has no business interacting with GitHub or any
# AI provider. The common module contains GitHubService, RepoContextService, and
# AiClientConfig, but all three are guarded by @ConditionalOnProperty:
#
#   aiqa.github.enabled=true   → enables GitHubService + RepoContextService + AiClient
#   (absent / false)           → none of those beans are created
#
# Do NOT add aiqa.github.enabled: true here. Setting it would cause pr-service
# to try to resolve GitHub credentials at startup and prompt for a username/token
# via the git credential helper.
# ───────────────────────────────────────────────────────────────────────────────


logging:
  level:
    nz.co.eroad.qaisystem: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN

# ── Security: restrict actuator exposure ──────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
