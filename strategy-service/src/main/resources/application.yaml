spring:
  application:
    name: strategy-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: strategy-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false
    properties:
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 10000
  data:
    redis:
      # Default to localhost so the Docker Redis started by docker compose up -d works
      # without any extra configuration.  Override with REDIS_HOST for production.
      # Leave this at localhost — InMemoryPrTracker is used as fallback if the
      # connection attempt times out, because RedisPrTracker is @ConditionalOnProperty.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

kafka:
  topics:
    feature-updates: FeatureUpdatesQueue
    impact-results: ImpactResultsQueue
    test-scripts: TestScriptsQueue
    test-results: TestResultsQueue
    feedback: FeedbackQueue

# aiqa.codegen.enabled=false → strategy-service does NOT consume TestScriptsQueue
# (codegen-service handles it). Set to true for legacy monolith mode.
aiqa:
  base-url: ${API_BASE_URL:http://localhost:8080}
  ui:
    base-url: ${UI_BASE_URL:http://localhost:3000}
  mobile:
    app-path: ${MOBILE_APP_PATH:}
    device-name: ${MOBILE_DEVICE_NAME:emulator-5554}
    platform: ${MOBILE_PLATFORM:Android}
    appium-url: ${APPIUM_URL:http://localhost:4723/wd/hub}
  github:
    enabled: true                 # enables GitHubService, RepoContextService
  # ── Agent scaling (per-instance copilot concurrency + isolated worktrees) ────
  agent:
    max-concurrent: ${AIQA_AGENT_MAX_CONCURRENT:3}           # also Kafka listener concurrency
    workspace-pool-size: ${AIQA_AGENT_WORKSPACE_POOL_SIZE:0} # 0 = match max-concurrent
    isolated-workspaces: ${AIQA_AGENT_ISOLATED_WORKSPACES:true}
    workspace-lease-timeout-seconds: ${AIQA_AGENT_WS_LEASE_TIMEOUT:600}
  codegen:
    enabled: false
  monitor:
    report-interval-ms: ${AI_MONITOR_INTERVAL_MS:300000}   # 5 minutes default
  stabilization:
    max-retries:    3
    retry-delay-ms: 2000
  strategy:
    risk-threshold-high: 0.7
    risk-threshold-medium: 0.4
    # Pull latest test repo commits before every coverage analysis.
    # Ensures tests already merged into the repo are visible — prevents duplicate
    # scenario generation when the same PR payload is submitted more than once.
    # Set to false only for high-throughput scenarios where git pull latency matters.
    refresh-on-analysis: ${AIQA_REFRESH_ON_ANALYSIS:true}
  # ── Security: admin API key for sensitive endpoints ───────────────────────────
  # Protects POST /api/strategy/approve-bdd, POST /api/strategy/refresh-context,
  # GET /api/strategy/pending-bdd. Set AIQA_ADMIN_KEY in production.
  api:
    admin-key: ${AIQA_ADMIN_KEY:}
  target-repo:
    url: ${TARGET_REPO_URL:}             # e.g. https://github.com/your-org/your-test-repo
    branch: main
    local-path: /tmp/qa-context-repo
    # When false (default) the service does NOT scan tests/api|ui|mobile for context;
    # the target repo Conductor agent gathers context instead. Set true for legacy mode.
    scan-modules: ${TARGET_REPO_SCAN_MODULES:false}

    # ── Fallback local path ─────────────────────────────────────────────────────
    # If the remote clone/pull fails (or no URL is set), this local directory is
    # used as the context source instead.
    #
    # COMMON USE CASES:
    #
    # 1. IntelliJ already has the test repo checked out locally:
    #    fallback-local-path: /Users/yourname/projects/your-test-repo
    #    (no credentials needed — git never touches the network)
    #
    # 2. You want ONLY the local copy (skip remote entirely):
    #    url: ""                          # leave blank — remote clone is skipped
    #    fallback-local-path: /path/to/local/repo
    #
    # 3. Keep the local copy fresh (git pull on the fallback before scanning):
    #    fallback-pull: true
    #    (uses the system credential store — osxkeychain on macOS — same credentials
    #     that IntelliJ uses for GitHub, so no extra config needed)
    fallback-local-path: ""        # leave blank to disable; set to your local repo path
    fallback-pull: false           # set true to git pull the fallback before scanning

    modules:
      api: tests/api
      ui: tests/ui
      mobile: tests/mobile
    auth:
      # auth type: none | token | ssh
      #
      # none  → GitHubService first checks TARGET_REPO_TOKEN; if blank it calls
      #         "git credential fill" which reads whatever token the system
      #         credential helper holds for https://github.com.
      #         On macOS this is osxkeychain — the same store IntelliJ writes
      #         to when you authorise it with GitHub, so local dev works with
      #         zero extra configuration as long as IntelliJ is already
      #         connected to GitHub.
      #         For CI/production, set TARGET_REPO_TOKEN instead (more explicit).
      #
      # token → always use TARGET_REPO_TOKEN (embed a PAT in the HTTPS URL).
      #         Most reliable for servers / Docker containers where git
      #         credential helpers are not set up.
      #         Set TOKEN and USERNAME as environment variables:
      #           export TARGET_REPO_TOKEN=ghp_your_token
      #           export TARGET_REPO_USERNAME=your_github_username
      #
      # ssh   → use the SSH agent for JGit clone/pull. Note: the GitHub REST
      #         API always requires a token, so PR creation is disabled when
      #         type=ssh unless TARGET_REPO_TOKEN is also set.
      #
      # Defaults to 'token' so TARGET_REPO_TOKEN is embedded in the HTTPS clone URL.
      # Falls back to the plain URL automatically when the token is blank
      # (public repos / SSH). Override with TARGET_REPO_AUTH_TYPE=none|ssh if needed.
      type: ${TARGET_REPO_AUTH_TYPE:token}
      token: ${TARGET_REPO_TOKEN:}
      username: ${TARGET_REPO_USERNAME:}

github:
  # HMAC-SHA256 secret configured in the GitHub webhook settings.
  # Requests without a matching signature are rejected (401).
  # Leave blank in local dev to skip signature verification entirely.
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  webhook:
    # Fail-secure: reject webhook requests when no secret configured.
    # Set GITHUB_WEBHOOK_REQUIRE_SECRET=true in production.
    require-secret: ${GITHUB_WEBHOOK_REQUIRE_SECRET:true}

# ── AI Generation ──────────────────────────────────────────────────────────────
#
# The only supported AI provider is the locally installed GitHub Copilot CLI.
# Prerequisites: brew install gh && gh auth login
# No token env var needed — gh CLI manages credentials automatically via OS keychain.
#
  ai:
    provider: copilot-cli
    copilot-cli:
      gh-cli-path: ${GH_CLI_PATH:gh}              # path to gh executable (must be on PATH)
      model:       ${COPILOT_CLI_MODEL:claude-sonnet-4-5}     # model passed in the JSON body
      timeout-seconds: ${COPILOT_CLI_TIMEOUT:120}
    copilot-agent:
      copilot-cli-path: ${COPILOT_CLI_PATH:copilot}           # path to copilot executable
      max-concurrent-agents: ${COPILOT_MAX_CONCURRENT:3}      # semaphore limit
      agent-timeout-seconds: ${COPILOT_AGENT_TIMEOUT:300}     # 5 min hard kill
      max-output-chars: ${COPILOT_MAX_OUTPUT_CHARS:200000}    # accumulated text cap
      working-dir: ${COPILOT_AGENT_WORKING_DIR:}              # blank = use target-repo local-path
      max-autopilot-continues: ${COPILOT_MAX_AUTOPILOT_CONTINUES:5}  # continuation limit
  conversation:
    ttl-days: ${AIQA_CONV_TTL_DAYS:30}
    max-history-chars: ${AIQA_CONV_MAX_CHARS:65536}
    max-compressed-bytes: ${AIQA_CONV_MAX_COMPRESSED:32768}

server:
  port: 8082

logging:
  level:
    nz.co.eroad.qaisystem: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN

# ── Security: restrict actuator exposure ──────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never


# ── Security: webhook secret (fail-secure in production) ─────────────────────
# Already merged into the github: block above.
# Set GITHUB_WEBHOOK_SECRET and GITHUB_WEBHOOK_REQUIRE_SECRET=true in production.

