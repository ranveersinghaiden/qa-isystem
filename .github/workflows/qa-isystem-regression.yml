name: QA local regression validation

on:
  push:
    paths:
      - ".github/scripts/qa-isystem/**"
      - ".github/workflows/qa-isystem-*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run local validation
        run: python3 -m pytest .github/scripts/qa-isystem/tests -q
