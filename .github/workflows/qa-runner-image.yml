# Build QA Runner Image   (Design doc Part E.4 — "the backpack")
#
# Lives in the SOURCE repo (QA-ISystem) because it compiles all 5 service jars
# and bakes them into the ARC runner image. The 3 dispatch workflows
# (qa-impact-strategy / qa-codegen / qa-feedback) live in the separate
# `qa-control` orchestration repo — see qa-control/README.md for why the split.
#
# Publishes ghcr.io/<owner>/qa-isystem/qa-runner:{latest,<sha>} which the ARC
# scale set (k8s/arc/runner-scale-set-values.yaml) pulls.

name: Build QA Runner Image

on:
  push:
    branches: [main]
    paths:
      - 'runner-image/**'
      - '**/pom.xml'
      - '**/src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build all 5 jars
        run: ./mvnw -q -B -DskipTests package

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runner-image/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/qa-runner:latest
            ghcr.io/${{ github.repository }}/qa-runner:${{ github.sha }}
