# QA · Codegen + Gather   (Design doc Part E.2)
#
# Triggered by the receiver after a human APPROVES the BDD PR (qa/bdd/*).
# Run 2 of the 3-run pipeline:
#   prepare → builds a dynamic matrix of scenario ids from the DB
#   codegen → fans out, ONE pod per scenario (Decision C3), generate + stabilize
#   gather  → aggregates results, opens the test-script PR, gate = awaiting_tests_approval

name: QA · Codegen + Gather

on:
  repository_dispatch:
    types: [bdd_approved]

concurrency:
  group: qa-${{ github.event.client_payload.prId }}
  cancel-in-progress: false   # never cancel codegen mid-stabilization

env:
  AI_BASE_URL: http://headroom.qa.svc.cluster.local:8787
  QA_DB_URL: ${{ secrets.QA_DB_URL }}
  SCENARIOS_PER_POD: "1"      # Decision C3 knob

jobs:
  prepare:
    runs-on: [self-hosted, qa-runner]
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}   # dynamic matrix from DB
    steps:
      - uses: actions/create-github-app-token@v1
        id: tok
        with:
          app-id: ${{ vars.QA_APP_ID }}
          private-key: ${{ secrets.QA_APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.owner }}
          repositories: ${{ github.event.client_payload.repo }}

      - name: Clone target @ head SHA (once) → artifact
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          git clone --depth 1 --single-branch \
            --branch "${{ github.event.client_payload.branch }}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.event.client_payload.owner }}/${{ github.event.client_payload.repo }}.git" target
          git -C target checkout "${{ github.event.client_payload.headSha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: target-src-${{ github.event.client_payload.prId }}
          path: target
          retention-days: 1

      - id: list
        name: Build scenario matrix from DB
        run: |
          echo "matrix=$(java -jar /app/strategy.jar --mode list-scenarios \
            --pr-id '${{ github.event.client_payload.prId }}' \
            --per-pod "$SCENARIOS_PER_POD")" >> "$GITHUB_OUTPUT"
          # prints {"include":[{"id":"S1"},{"id":"S2"},…]}

  codegen:
    needs: prepare
    runs-on: [self-hosted, qa-runner]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20            # ARC maxRunners caps real concurrency too
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: target-src-${{ github.event.client_payload.prId }}
          path: target

      - name: Generate + stabilize one scenario
        run: >
          java -jar /app/codegen.jar --mode oneshot
          --pr-id "${{ github.event.client_payload.prId }}"
          --scenario "${{ matrix.id }}" --target-dir target
        # copilot-CLI Conductor agent + StabilizationLoop in-process; writes per-scenario result to DB

  gather:
    needs: codegen
    if: ${{ !cancelled() }}       # run even if some scenarios failed (surgical retry later)
    runs-on: [self-hosted, qa-runner]
    steps:
      - uses: actions/create-github-app-token@v1
        id: tok
        with:
          app-id: ${{ vars.QA_APP_ID }}
          private-key: ${{ secrets.QA_APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.owner }}
          repositories: ${{ github.event.client_payload.repo }}

      - name: Aggregate results → open test-script PR
        env:
          GH_APP_TOKEN: ${{ steps.tok.outputs.token }}
        run: >
          java -jar /app/codegen.jar --mode gather
          --pr-id "${{ github.event.client_payload.prId }}"
        # opens qa/tests/PR-… PR, sets gate = awaiting_tests_approval
