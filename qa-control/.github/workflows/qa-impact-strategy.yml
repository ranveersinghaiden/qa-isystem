# QA · Impact + Strategy   (Design doc Part E.1)
#
# Triggered by the serverless receiver on PR opened / synchronized.
# Run 1 of the 3-run pipeline: impact (deterministic, no AI) → strategy
# (copilot-CLI Conductor agent gathers its own context in-process) → opens the BDD PR → sets gate = awaiting_bdd_approval
# → pods vanish ($0 while the human reviews the BDD PR).
#
# Auth: NO tokens travel in dispatch payloads. Each job mints a fresh,
# target-scoped installation token via actions/create-github-app-token.

name: QA · Impact + Strategy

on:
  repository_dispatch:
    types: [pr_opened, pr_sync]

concurrency:
  # Newer push for the same PR cancels the older run (kills the historic 4×-BDD-PR race).
  group: qa-${{ github.event.client_payload.prId }}
  cancel-in-progress: true

env:
  AI_BASE_URL: http://headroom.qa.svc.cluster.local:8787   # Decision C2 — in-cluster headroom Service
  QA_DB_URL: ${{ secrets.QA_DB_URL }}                       # Neon, Decision C1

jobs:
  impact:
    runs-on: [self-hosted, qa-runner]                      # ARC scale set, custom image
    timeout-minutes: 15
    steps:
      - name: Impact analysis (deterministic, no AI)
        run: >
          java -jar /app/impact.jar --mode oneshot
          --pr-id "${{ github.event.client_payload.prId }}"
        # reads the PR payload from DB, writes ImpactEnvelope + risk back to DB

  strategy:
    needs: impact
    runs-on: [self-hosted, qa-runner]
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@v1
        id: tok
        with:
          app-id: ${{ vars.QA_APP_ID }}
          private-key: ${{ secrets.QA_APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.owner }}
          repositories: ${{ github.event.client_payload.repo }}

      - name: Clone target @ head SHA (once) → artifact
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          git clone --depth 1 --single-branch \
            --branch "${{ github.event.client_payload.branch }}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.event.client_payload.owner }}/${{ github.event.client_payload.repo }}.git" target
          git -C target checkout "${{ github.event.client_payload.headSha }}"   # pin the exact version

      - uses: actions/upload-artifact@v4
        with:
          name: target-src-${{ github.event.client_payload.prId }}
          path: target
          retention-days: 1

      - name: Generate BDD + open BDD PR (Conductor agent in-process)
        env:
          GH_APP_TOKEN: ${{ steps.tok.outputs.token }}
        run: >
          java -jar /app/strategy.jar --mode oneshot
          --pr-id "${{ github.event.client_payload.prId }}"
          --target-dir target
        # writes scenarios to DB, opens qa/bdd/PR-… PR, sets gate = awaiting_bdd_approval

      - name: Context-trace → job summary
        if: always()
        run: cat /app/out/context-trace-summary.md >> "$GITHUB_STEP_SUMMARY" || true
