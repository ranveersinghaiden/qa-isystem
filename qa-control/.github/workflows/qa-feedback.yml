# QA · Feedback   (Design doc Part E.3)
#
# Triggered by the receiver when a human requests CHANGES on a QA-authored PR.
# Reads the review comments, regenerates via the in-process feedback loop, and
# updates the PR. Short-lived; cancel-in-progress so the newest review wins.

name: QA · Feedback

on:
  repository_dispatch:
    types: [pr_changes_requested]

concurrency:
  group: qa-fb-${{ github.event.client_payload.prId }}
  cancel-in-progress: true

env:
  AI_BASE_URL: http://headroom.qa.svc.cluster.local:8787
  QA_DB_URL: ${{ secrets.QA_DB_URL }}

jobs:
  feedback:
    runs-on: [self-hosted, qa-runner]
    steps:
      - uses: actions/create-github-app-token@v1
        id: tok
        with:
          app-id: ${{ vars.QA_APP_ID }}
          private-key: ${{ secrets.QA_APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.owner }}
          repositories: ${{ github.event.client_payload.repo }}

      - name: Read review comments → regenerate → update PR
        env:
          GH_APP_TOKEN: ${{ steps.tok.outputs.token }}
        run: >
          java -jar /app/feedback.jar --mode oneshot
          --pr-id "${{ github.event.client_payload.prId }}"
          --review-id "${{ github.event.client_payload.reviewId }}"
