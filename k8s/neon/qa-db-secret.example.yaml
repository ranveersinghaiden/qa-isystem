# TEMPLATE — do NOT commit the real connection string. (Design doc Decision C1: Neon
# serverless Postgres replaces Redis.) Runner pods read QA_DB_URL from this Secret.
#
# Recommended (imperative, keeps the secret out of git):
#   kubectl create secret generic qa-db -n qa \
#     --from-literal=url='postgresql://USER:PASSWORD@HOST.neon.tech/qa?sslmode=require'
#
# Apply the schema once after the DB exists:
#   psql "$QA_DB_URL" -f db/schema.sql
apiVersion: v1
kind: Secret
metadata:
  name: qa-db
  namespace: qa
type: Opaque
stringData:
  # Neon pooled connection string. sslmode=require is mandatory.
  url: "postgresql://USER:PASSWORD@HOST.neon.tech/qa?sslmode=require"
