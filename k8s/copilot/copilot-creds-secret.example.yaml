# TEMPLATE — do NOT commit real credentials. The runner image bakes the GitHub
# Copilot CLI (the DEFAULT engine, aiqa.ai.provider=copilot-cli) but NOT its auth.
# Each ephemeral pod needs an authenticated `copilot` + `gh`. Mirror the proven
# headroom pattern: log in ONCE on a host, then mount the creds into every pod.
#
# Recommended (imperative, keeps creds out of git):
#   # On a host where you ran the Copilot CLI login once (creds saved in ~/.copilot):
#   kubectl create secret generic copilot-creds -n qa \
#     --from-file=$HOME/.copilot
#   # And a Copilot-entitled token for `gh` (org PAT with Copilot access):
#   kubectl create secret generic copilot-gh-token -n qa \
#     --from-literal=token='ghp_xxx_copilot_entitled'
#
# Mounted by k8s/arc/runner-scale-set-values.yaml at /home/runner/.copilot (read-only)
# and surfaced as GH_TOKEN. NEVER commit the populated files.
apiVersion: v1
kind: Secret
metadata:
  name: copilot-creds
  namespace: qa
type: Opaque
stringData:
  # Replace with the contents of the host's ~/.copilot login artifacts.
  # (Exact filenames depend on the Copilot CLI version; --from-file=$HOME/.copilot
  #  captures them all. Shown here only as a placeholder.)
  "REPLACE_WITH_COPILOT_CREDS_FILES": "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: copilot-gh-token
  namespace: qa
type: Opaque
stringData:
  # A Copilot-entitled GitHub token for `gh` auth inside the pod (NOT the per-job
  # app token, which lacks Copilot API access).
  token: "REPLACE_ME"
