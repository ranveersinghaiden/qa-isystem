# Actions Runner Controller (ARC) — runner scale set Helm values  (Design doc Phase 3)
#
# Install with the gha-runner-scale-set chart, AFTER installing the ARC controller
# (gha-runner-scale-set-controller). This is the scale-to-zero runner pool that
# executes every one-shot pod.
#
#   helm upgrade --install qa-runner \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#     --namespace qa --create-namespace \
#     -f k8s/arc/runner-scale-set-values.yaml
#
# Workflows reference this pool. With ARC runner scale sets the canonical form is
#   runs-on: qa-runner
# The design doc's `runs-on: [self-hosted, qa-runner]` label array also resolves to
# this scale set when the controller is configured for label matching.

# The scale-set name == the runs-on value the workflows use.
runnerScaleSetName: qa-runner

# Install the App on the org/repo and point this at it. Use an org URL to serve
# many target repos from one pool, or a single repo URL for a pilot.
githubConfigUrl: https://github.com/ranveersinghaiden

# A pre-created secret holding the GitHub App credentials for ARC itself
# (separate from the per-job tokens the workflows mint). Create with:
#   kubectl create secret generic qa-arc-github-app -n qa \
#     --from-literal=github_app_id=<APP_ID> \
#     --from-literal=github_app_installation_id=<INSTALLATION_ID> \
#     --from-file=github_app_private_key=<path-to-app.pem>
githubConfigSecret: qa-arc-github-app

# ── Scale-to-zero ──────────────────────────────────────────────────────────────
minRunners: 0          # nothing idle → $0 between PRs (Decision: scale to zero)
maxRunners: 60         # peak concurrency cap (60–100 per Phase 3); ~1 vCPU / 2 GB each

# Ephemeral pods: a fresh pod per job, destroyed after the job (no reuse → clean state).
containerMode:
  type: kubernetes
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: standard
    resources:
      requests:
        storage: 4Gi

template:
  spec:
    # Prefer cheap, interruptible capacity (Decision: spot nodes, autoscale → 0).
    nodeSelector:
      kubernetes.io/arch: amd64
    tolerations:
      - key: "spot"
        operator: "Exists"
        effect: "NoSchedule"
    containers:
      - name: runner
        # Built + pushed by QA-ISystem/.github/workflows/qa-runner-image.yml (E.4).
        image: ghcr.io/ranveersinghaiden/qa-isystem/qa-runner:latest
        imagePullPolicy: Always
        command: ["/home/runner/run.sh"]
        env:
          # Pods reach the shared in-cluster headroom Service (Decision C2).
          - name: AI_BASE_URL
            value: http://headroom.qa.svc.cluster.local:8787
          # Copilot CLI is the DEFAULT engine (aiqa.ai.provider=copilot-cli). Its
          # auth is NOT baked into the image — gh authenticates from a Copilot-
          # entitled token mounted here (see k8s/copilot/copilot-creds-secret.example.yaml).
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: copilot-gh-token
                key: token
          # Neon connection string (Decision C1) — from the Secret in k8s/neon/.
          - name: QA_DB_URL
            valueFrom:
              secretKeyRef:
                name: qa-db
                key: url
        volumeMounts:
          # The standalone `copilot` binary reads login creds from ~/.copilot.
          # Populate the Secret once from a host where you ran the Copilot CLI login
          # (mirrors the headroom creds pattern). Read-only.
          - name: copilot-creds
            mountPath: /home/runner/.copilot
            readOnly: true
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
    volumes:
      - name: copilot-creds
        secret:
          secretName: copilot-creds
