# ── KEDA ScaledObject — strategy-service ────────────────────────────────────
#
# Scales strategy-service replicas based on consumer-group lag on
# ImpactResultsQueue (12 partitions → max 12 useful consumer instances).
#
# Scale-out rule:  when lag/replica > lagThreshold (5) → add replica
# Wake from zero:  when total lag > activationLagThreshold (1) → min 1 replica
#
# Throughput formula (per instance AIQA_AGENT_MAX_CONCURRENT=3, BDD latency ~3.5 min):
#   ≈ 3 / 3.5 ≈ 0.85 PRs/min/replica
#   With 12 replicas: ≈ 10 PRs/min
#
# Prerequisites:
#   - KEDA installed (helm install keda kedacore/keda)
#   - kafka-trigger-auth.yaml applied
#   - strategy-deployment.yaml applied
#
# Apply:
#   kubectl apply -f k8s/keda/strategy-scaledobject.yaml -n qa-isystem
# ────────────────────────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: strategy-service-scaler
  namespace: qa-isystem
spec:
  scaleTargetRef:
    name: strategy-service

  # Replica bounds
  minReplicaCount: 1    # keep 1 warm replica; set to 0 to allow scale-to-zero
  maxReplicaCount: 12   # capped at ImpactResultsQueue partition count (12)

  # How quickly KEDA acts on lag changes
  pollingInterval: 15   # seconds between lag checks
  cooldownPeriod: 120   # seconds to wait before scaling in after lag drains

  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092       # overridden by TriggerAuthentication
        consumerGroup: strategy-service-group
        topic: ImpactResultsQueue
        # Scale out when lag per current replica exceeds this.
        # e.g. 5 unprocessed PRs waiting per replica → add another replica.
        lagThreshold: "5"
        # Wake from minReplicaCount=0 when total lag exceeds this.
        activationLagThreshold: "1"
        offsetResetPolicy: latest
      authenticationRef:
        name: kafka-trigger-auth
