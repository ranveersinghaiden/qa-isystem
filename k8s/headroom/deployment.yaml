# Headroom Service — single tiny always-on compression proxy  (Design doc Decision C2)
#
# One shared, stateless pod (replicas >= 2 for availability) that every one-shot
# runner pod reaches at http://headroom.qa.svc.cluster.local:8787. OAuth creds live
# in ONE Secret mounted here only — never baked into the runner image, never per-pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: qa
  labels:
    app: headroom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
    spec:
      containers:
        - name: headroom
          # Bake from the same headroom-ai[proxy] runtime proven in
          # strategy-service/Dockerfile, or use an upstream headroom image.
          image: ghcr.io/ranveersinghaiden/qa-isystem/headroom:latest
          imagePullPolicy: Always
          command: ["headroom", "proxy", "--host", "0.0.0.0", "--port", "8787", "--no-telemetry"]
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: HEADROOM_TELEMETRY
              value: "off"
            # OAuth creds (the registered "copilot" device) come from the Secret.
            # headroom reads ~/.headroom; mount the Secret there.
          volumeMounts:
            - name: headroom-creds
              mountPath: /home/headroom/.headroom
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
      volumes:
        - name: headroom-creds
          secret:
            secretName: headroom-creds
