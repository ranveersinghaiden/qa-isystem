# TEMPLATE — do NOT commit real credentials. Copy to secret.yaml (gitignored) and fill,
# or create imperatively. This holds the headroom OAuth device credentials (Decision C2):
# the single place creds exist in-cluster, mounted read-only into the headroom pod only.
#
# Recommended (imperative, keeps secrets out of files):
#   # On a machine where `headroom device add copilot` has already been run:
#   kubectl create secret generic headroom-creds -n qa \
#     --from-file=credentials=$HOME/.headroom/credentials
#
# Then `kubectl rollout restart deployment/headroom -n qa`.
apiVersion: v1
kind: Secret
metadata:
  name: headroom-creds
  namespace: qa
type: Opaque
stringData:
  # Replace with the contents of ~/.headroom/credentials from a device-registered host.
  # Never commit the populated file.
  credentials: "REPLACE_ME"
