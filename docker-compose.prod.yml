# docker-compose.prod.yml
#
# Production overlay for QA-ISystem.
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file defines the five application services using the GHCR images
# built by CI. It extends the base docker-compose.yml which provides Kafka,
# Zookeeper, and Redis.
#
# Required environment variables (set in a .env file at DEPLOY_PATH on the server):
#
#   # Container registry — the GitHub org / user that owns the packages
#   GHCR_ORG=your-github-org                 # e.g. "acme-corp"
#
#   # Optional: pin to specific image tags (default: latest)
#   PR_SERVICE_TAG=latest
#   IMPACT_SERVICE_TAG=latest
#   STRATEGY_SERVICE_TAG=latest
#   CODEGEN_SERVICE_TAG=latest
#   FEEDBACK_SERVICE_TAG=latest
#
#   # Target test repo (strategy / codegen / feedback services)
#   TARGET_REPO_TOKEN=ghp_your_token
#   TARGET_REPO_USERNAME=your_github_username
#   TARGET_REPO_URL=https://github.com/your-org/your-test-repo
#   GITHUB_WEBHOOK_SECRET=your_hmac_secret
#
#   # ── Security: admin API key ──────────────────────────────────────────────────
#   # Protects POST /api/strategy/approve-bdd, POST /api/strategy/refresh-context,
#   # GET /api/strategy/pending-bdd. Callers must send: -H "X-Admin-Key: <value>"
#   # Generate with: openssl rand -hex 32
#   AIQA_ADMIN_KEY=<your-random-secret>
#
#   # Reject GitHub webhooks when GITHUB_WEBHOOK_SECRET is not set (fail-secure).
#   # Set to "true" in production. Set to "false" only for local dev without ngrok.
#   GITHUB_WEBHOOK_REQUIRE_SECRET=true
#
#   # ── AI provider ───────────────────────────────────────────────────────────
#   # Only Copilot CLI is supported. Ensure 'gh auth login' has been run on the host.
#   # GH_CLI_PATH is optional — defaults to 'gh' on PATH.
#   # GH_CLI_PATH=/usr/local/bin/gh
#
#   # impact-service: AI evaluator (optional — disabled by default)
#   AIQA_AI_ENABLED=false                   # set to "true" to activate
#
#   # Kafka advertised listener — must be the server's IP or DNS name
#   KAFKA_HOST=your-server-ip

services:

  # ── pr-service ──────────────────────────────────────────────────────────────
  pr-service:
    image: ghcr.io/${GHCR_ORG}/qa-isystem/pr-service:${PR_SERVICE_TAG:-latest}
    container_name: qa-pr-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/pr/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ── impact-service ──────────────────────────────────────────────────────────
  impact-service:
    image: ghcr.io/${GHCR_ORG}/qa-isystem/impact-service:${IMPACT_SERVICE_TAG:-latest}
    container_name: qa-impact-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8081
      # AI last-resort evaluator — set AIQA_AI_ENABLED=true to activate
      AIQA_AI_ENABLED: ${AIQA_AI_ENABLED:-false}
      AIQA_AI_API_KEY: ${AIQA_AI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/api/impact/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ── strategy-service ────────────────────────────────────────────────────────
  strategy-service:
    image: ghcr.io/${GHCR_ORG}/qa-isystem/strategy-service:${STRATEGY_SERVICE_TAG:-latest}
    container_name: qa-strategy-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8082
      # Target test repo — strategy-service clones this at startup to build the coverage index
      AIQA_TARGET_REPO_URL: ${TARGET_REPO_URL:-}
      AIQA_TARGET_REPO_AUTH_TOKEN: ${TARGET_REPO_TOKEN:-}
      AIQA_TARGET_REPO_AUTH_USERNAME: ${TARGET_REPO_USERNAME:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_WEBHOOK_REQUIRE_SECRET: ${GITHUB_WEBHOOK_REQUIRE_SECRET:-true}
      AIQA_ADMIN_KEY: ${AIQA_ADMIN_KEY:-}
      # AI provider — Copilot CLI only; gh auth must be configured on the host
      GH_CLI_PATH: ${GH_CLI_PATH:-gh}
      COPILOT_CLI_MODEL: ${COPILOT_CLI_MODEL:-claude-sonnet-4-5}
      # ── Agent scaling: vertical scale (increase on larger hosts) ───────────
      # Each copilot agent ≈ 300–500 MB RSS. Safe ceiling: floor(RAM_GB / 0.5).
      # Horizontal scale via: docker compose up -d --scale strategy-service=N
      AIQA_AGENT_MAX_CONCURRENT: ${STRATEGY_AGENT_MAX_CONCURRENT:-3}
      AIQA_AGENT_ISOLATED_WORKSPACES: "true"
      # ── Headroom token compression ─────────────────────────────────────────
      # One-time host setup: headroom device add copilot
      # Then mount ~/.headroom below so device credentials are available.
      HEADROOM_ENABLED: ${HEADROOM_ENABLED:-false}
      HEADROOM_PORT: ${HEADROOM_PORT:-8787}
      HEADROOM_GITHUB_USERNAME: ${HEADROOM_GITHUB_USERNAME:-}
      HEADROOM_STARTUP_WAIT_SECONDS: ${HEADROOM_STARTUP_WAIT_SECONDS:-15}
    volumes:
      # Persist the cloned test repo between container restarts to avoid re-cloning every time
      - qa-repo-cache:/tmp/qa-context-repo
      # Headroom device credentials (created by: headroom device add copilot on host).
      # Only needed when HEADROOM_ENABLED=true; harmless when disabled.
      - ${HEADROOM_CREDENTIALS_PATH:-~/.headroom}:/home/spring/.headroom:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/api/strategy/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # longer start period — repo clone takes time

  # ── codegen-service ─────────────────────────────────────────────────────────
  codegen-service:
    image: ghcr.io/${GHCR_ORG}/qa-isystem/codegen-service:${CODEGEN_SERVICE_TAG:-latest}
    container_name: qa-codegen-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8083
      TARGET_REPO_URL: ${TARGET_REPO_URL:-}
      TARGET_REPO_TOKEN: ${TARGET_REPO_TOKEN:-}
      TARGET_REPO_USERNAME: ${TARGET_REPO_USERNAME:-}
      GH_CLI_PATH: ${GH_CLI_PATH:-gh}
      COPILOT_CLI_MODEL: ${COPILOT_CLI_MODEL:-claude-sonnet-4-5}
      # ── Agent scaling ─────────────────────────────────────────────────────
      # Horizontal: docker compose up -d --scale codegen-service=N
      # (N × AIQA_AGENT_MAX_CONCURRENT must not exceed TestScriptsQueue partitions=24)
      AIQA_AGENT_MAX_CONCURRENT: ${CODEGEN_AGENT_MAX_CONCURRENT:-3}
      AIQA_AGENT_ISOLATED_WORKSPACES: "true"
      # ── Headroom token compression ─────────────────────────────────────────
      HEADROOM_ENABLED: ${HEADROOM_ENABLED:-false}
      HEADROOM_PORT: ${HEADROOM_PORT:-8787}
      HEADROOM_GITHUB_USERNAME: ${HEADROOM_GITHUB_USERNAME:-}
      HEADROOM_STARTUP_WAIT_SECONDS: ${HEADROOM_STARTUP_WAIT_SECONDS:-15}
    volumes:
      - qa-codegen-repo-cache:/tmp/qa-context-repo-codegen
      # Headroom device credentials (created by: headroom device add copilot on host).
      - ${HEADROOM_CREDENTIALS_PATH:-~/.headroom}:/home/spring/.headroom:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── feedback-service ─────────────────────────────────────────────────────────
  feedback-service:
    image: ghcr.io/${GHCR_ORG}/qa-isystem/feedback-service:${FEEDBACK_SERVICE_TAG:-latest}
    container_name: qa-feedback-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8084
      TARGET_REPO_URL: ${TARGET_REPO_URL:-}
      TARGET_REPO_TOKEN: ${TARGET_REPO_TOKEN:-}
      TARGET_REPO_USERNAME: ${TARGET_REPO_USERNAME:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GH_CLI_PATH: ${GH_CLI_PATH:-gh}
      COPILOT_CLI_MODEL: ${COPILOT_CLI_MODEL:-claude-sonnet-4-5}
    volumes:
      - qa-feedback-repo-cache:/tmp/qa-context-repo-feedback
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  # Shared cache volumes for cloned test repositories
  qa-repo-cache:
    driver: local
  qa-codegen-repo-cache:
    driver: local
  qa-feedback-repo-cache:
    driver: local

# Override Kafka advertised listener so services inside Docker can reach
# the broker by hostname, and external clients can reach it on port 9092.
# The base docker-compose.yml uses localhost which doesn't work inside Docker networks.

