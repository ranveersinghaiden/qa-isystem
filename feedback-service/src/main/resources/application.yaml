server:
  port: 8084

spring:
  application:
    name: feedback-service
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    consumer:
      group-id: feedback-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}   # default: local Docker Redis; override for production
      port: ${REDIS_PORT:6379}

kafka:
  topics:
    feedback: FeedbackQueue

github:
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}

aiqa:
  github:
    enabled: true                 # enables GitHubService, RepoContextService
  target-repo:
    url: ${TARGET_REPO_URL:}
    branch: ${TARGET_REPO_BRANCH:main}
    local-path: /tmp/qa-context-repo-feedback
    fallback-local-path: ""
    fallback-pull: false
    auth:
      # Defaults to 'token' so TARGET_REPO_TOKEN is embedded in the HTTPS clone URL.
      # Falls back to the plain URL automatically when the token is blank
      # (public repos / SSH). Override with TARGET_REPO_AUTH_TYPE=none|ssh if needed.
      type: ${TARGET_REPO_AUTH_TYPE:token}
      token: ${TARGET_REPO_TOKEN:}
      username: ${TARGET_REPO_USERNAME:}
    modules:
      api: tests/api
      ui:  tests/ui
      mobile: tests/mobile
  # ── AI Generation — provider: copilot-cli (default) | copilot | openai ──────
  # See strategy-service/src/main/resources/application.yaml for full docs.
  ai:
    provider: ${AI_PROVIDER:copilot-cli}           # copilot-cli (default) | copilot | openai
    copilot-cli:
      gh-cli-path: ${GH_CLI_PATH:gh}
      model:       ${COPILOT_CLI_MODEL:gpt-4o}
      timeout-seconds: ${COPILOT_CLI_TIMEOUT:120}
    copilot-agent:
      copilot-cli-path: ${COPILOT_CLI_PATH:copilot}
      max-concurrent-agents: ${COPILOT_MAX_CONCURRENT:3}
      agent-timeout-seconds: ${COPILOT_AGENT_TIMEOUT:300}
      max-output-chars: ${COPILOT_MAX_OUTPUT_CHARS:200000}
      working-dir: ${COPILOT_AGENT_WORKING_DIR:}
      max-autopilot-continues: ${COPILOT_MAX_AUTOPILOT_CONTINUES:5}
    openai:
      api-key:  ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model:    ${OPENAI_MODEL:gpt-4o}
    copilot:
      token:    ${GITHUB_COPILOT_TOKEN:}
      base-url: ${COPILOT_BASE_URL:https://api.githubcopilot.com}
      model:    ${COPILOT_MODEL:gpt-4o}
  conversation:
    ttl-days: ${AIQA_CONV_TTL_DAYS:30}
    max-history-chars: ${AIQA_CONV_MAX_CHARS:65536}
    max-compressed-bytes: ${AIQA_CONV_MAX_COMPRESSED:32768}

logging:
  level:
    nz.co.eroad.qaisystem: INFO
    org.apache.kafka: WARN

# ── Security: restrict actuator exposure ──────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

