spring:
  # One-shot K8s migration: spring-boot-starter-jdbc is on the classpath for the optional
  # Postgres StateStore. Without spring.datasource.url, DataSourceAutoConfiguration would
  # crash normal boot ("Failed to determine a suitable driver class"), so exclude it by
  # default. StateStoreDataSourceConfig re-introduces a DataSource only when the URL is set.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  application:
    name: impact-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: impact-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false
    properties:
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 10000

kafka:
  topics:
    feature-updates: FeatureUpdatesQueue
    impact-results: ImpactResultsQueue
    test-scripts: TestScriptsQueue
    test-results: TestResultsQueue

# aiqa.github.enabled is intentionally absent here — impact-service uses only
# deterministic analysis (no GitHub API, no AI client, no repo context clone).
# See pr-service/application.yaml for a full explanation of the guard mechanism.
aiqa:
  strategy:
    risk-threshold-high: 0.7
    risk-threshold-medium: 0.4

  # ── AI last-resort evaluator ────────────────────────────────────────────────────
  # AI is only invoked when the deterministic risk score falls in the gray zone
  # [confidence-lower-bound, confidence-upper-bound]. Outside that range the
  # deterministic result is considered confident enough on its own.
  #
  # Provider selection (aiqa.ai.provider):
  #   openai   (default) — set AIQA_AI_API_KEY; override base-url for Azure/Ollama
  #   copilot            — set GITHUB_COPILOT_TOKEN; uses GitHub Copilot API
  ai:
    enabled:    false                                # opt-in; set to true to activate
    provider:   ${AI_PROVIDER:copilot}               # openai | copilot
    # OpenAI provider settings (used when provider=openai)
    api-key:    ${AIQA_AI_API_KEY:}                 # injected from env — never hard-code
    base-url:   https://api.openai.com/v1
    # Copilot provider settings (used when provider=copilot)
    copilot-token:    ${GITHUB_COPILOT_TOKEN:}      # GitHub token with Copilot access
    copilot-base-url: https://api.githubcopilot.com
    # Model (applies to both providers)
    model:      gpt-4o-mini                         # fast + cheap; change to gpt-4o for higher accuracy
    confidence-lower-bound: 0.30                    # scores below this → confidently LOW, skip AI
    confidence-upper-bound: 0.75                    # scores above this → confidently HIGH+, skip AI
    max-diff-chars:   3000                          # truncate large diffs before sending to LLM
    timeout-seconds:  15                            # fail-fast if LLM is slow
    max-score-adjustment: 0.15                      # AI can adjust score by at most ±0.15

server:
  port: 8081

logging:
  level:
    nz.co.eroad.qaisystem: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN

# ── Security: restrict actuator exposure ──────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

