server:
  port: 8083

spring:
  application:
    name: codegen-service
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    consumer:
      group-id: codegen-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}   # default: local Docker Redis; override for production
      port: ${REDIS_PORT:6379}

kafka:
  topics:
    test-scripts: TestScriptsQueue
    test-results: TestResultsQueue
    feedback: FeedbackQueue

aiqa:
  base-url: ${API_BASE_URL:http://localhost:8080}
  ui:
    base-url: ${UI_BASE_URL:http://localhost:3000}
  mobile:
    app-path: ${MOBILE_APP_PATH:}
    device-name: ${MOBILE_DEVICE_NAME:emulator-5554}
    platform: ${MOBILE_PLATFORM:Android}
    appium-url: ${APPIUM_URL:http://localhost:4723/wd/hub}
  github:
    enabled: true                 # enables GitHubService, RepoContextService
  stabilization:
    max-retries: 3
    retry-delay-ms: 2000
  target-repo:
    url: ${TARGET_REPO_URL:}
    branch: ${TARGET_REPO_BRANCH:main}
    local-path: /tmp/qa-context-repo-codegen
    fallback-local-path: ""
    fallback-pull: false
    auth:
      type: none
      token: ${TARGET_REPO_TOKEN:}
      username: ${TARGET_REPO_USERNAME:}
    modules:
      api: tests/api
      ui:  tests/ui
      mobile: tests/mobile
  # ── AI Generation — only Copilot CLI is supported ───────────────────────────
  # Prerequisites: brew install gh && gh auth login
  ai:
    provider: copilot-cli
    copilot-cli:
      gh-cli-path: ${GH_CLI_PATH:gh}
      model:       ${COPILOT_CLI_MODEL:claude-sonnet-4-5}
      timeout-seconds: ${COPILOT_CLI_TIMEOUT:120}

logging:
  level:
    nz.co.eroad.qaisystem: INFO
    org.apache.kafka: WARN

# ── Security: restrict actuator exposure ──────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

